[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "flyo-disruption-desk"
version = "0.1.0"
description = "Synthetic flight disruption webhook MVP"
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.13.5",
  "SQLAlchemy==2.0.41",
  "uvicorn[standard]==0.34.3",
  "google-genai==1.47.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
